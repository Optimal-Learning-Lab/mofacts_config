<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName mofacts.optimallearning.org
  ServerAlias mofacts.optimallearning.org
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://d2xvti2irp4c7t.cloudfront.net; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://mofacts.optimallearning.org; media-src 'self' blob: data: https://d2xvti2irp4c7t.cloudfront.net; worker-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com https://d2xvti2irp4c7t.cloudfront.net https://plot.ly https://cran.r-project.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined

  RequestHeader set X-Forwarded-Proto https
  RequestHeader set X-Forwarded-Port 443

  ProxyPass /websocket ws://127.0.0.1:3000/websocket
  ProxyPassMatch ^/sockjs/(.*)/websocket ws://127.0.0.1:3000/sockjs/$1/websocket

  ProxyPass / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/
  ProxyPreserveHost on

  SetEnv proxy-initial-not-pooled 1
  SetEnv proxy-nokeepalive 1

  SSLCertificateFile /etc/letsencrypt/live/mofacts.optimallearning.org/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/mofacts.optimallearning.org/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
