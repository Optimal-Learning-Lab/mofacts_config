<VirtualHost *:80>
  ServerName staging2.optimallearning.org
  DocumentRoot /var/www/mofacts-acme-bootstrap
  <Directory /var/www/mofacts-acme-bootstrap>
    Require all granted
    AllowOverride None
    Options None
  </Directory>
  RewriteEngine On
  RewriteCond %{HTTP_HOST} !^staging2\.optimallearning\.org(?::80)?$ [NC]
  RewriteRule ^ - [R=421,L]
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
RewriteCond %{SERVER_NAME} =staging2.optimallearning.org
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
