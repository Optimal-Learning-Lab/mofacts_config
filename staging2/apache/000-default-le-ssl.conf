<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName staging2.optimallearning.org
  ServerAlias staging2.optimallearning.org
  Header always set Strict-Transport-Security "max-age=31536000"
  # Plyr's YouTube provider loads the iframe API, its versioned player script,
  # thumbnail images, title metadata, and control icons; playback stays in the no-cookie frame.
  # Preserve application-owned stricter report/export policies.
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com/iframe_api https://www.youtube.com/s/player/; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://d2xvti2irp4c7t.cloudfront.net https://i.ytimg.com/vi/ https://upload.wikimedia.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://staging2.optimallearning.org https://openrouter.ai/api/v1/ https://en.wikipedia.org/w/api.php https://commons.wikimedia.org/w/api.php https://upload.wikimedia.org https://noembed.com/embed https://cdn.plyr.io/3.8.4/plyr.svg; media-src 'self' blob: data: https://d2xvti2irp4c7t.cloudfront.net https://cloud.google.com https://docs.cloud.google.com; worker-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com https://d2xvti2irp4c7t.cloudfront.net https://plot.ly https://cran.r-project.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" "expr=-z resp('Content-Security-Policy')"

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined

  # Reject other HTTP hostnames before any app proxy mapping.
  RewriteEngine On
  RewriteCond %{HTTP_HOST} !^staging2\.optimallearning\.org(?::443)?$ [NC]
  RewriteRule ^ - [R=421,L]
  ProxyRequests Off

  RequestHeader set X-Forwarded-Proto https
  RequestHeader set X-Forwarded-Port 443

  # Certbot owns temporary ACME challenge aliases during renewal.
  ProxyPass /.well-known/acme-challenge/ !
  ProxyPass /websocket ws://127.0.0.1:3000/websocket
  ProxyPassMatch ^/sockjs/(.*)/websocket ws://127.0.0.1:3000/sockjs/$1/websocket

  ProxyPass / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/
  ProxyPreserveHost on

  SetEnv proxy-initial-not-pooled 1
  SetEnv proxy-nokeepalive 1

  SSLCertificateFile /etc/letsencrypt/live/staging2.optimallearning.org/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/staging2.optimallearning.org/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
