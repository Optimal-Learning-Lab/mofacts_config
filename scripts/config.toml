# MoFaCTS configuration helpers

[[format_json]]
description = "Normalize mofacts_config JSON files while preserving literal HTML"
steps = [
  "Choose the JSON file under mofacts_config that needs normalization",
  "Read the file as raw text",
  "Replace any escaped HTML sequences (\\u003c, \\u003e, \\u0026) with literal characters",
  "Round-trip through ConvertFrom-Json and ConvertTo-Json -Depth 20 -Compress to remove inconsistent whitespace",
  "Pretty-print the compressed JSON with a 2-space indent",
  "Write the formatted content back to disk"
]
powershell_snippet = """
# Replace the path below with the JSON file you want to format
$path = 'C:/dev/mofacts_config/Countries Tutor/Countries Tutor/Worldtest.json'
$content = Get-Content -Raw $path
$content = $content.Replace('\u003c','<').Replace('\u003e','>').Replace('\u0026','&')
$min = ($content | ConvertFrom-Json | ConvertTo-Json -Depth 20 -Compress)
$min = $min.Replace('\u003c','<').Replace('\u003e','>').Replace('\u0026','&')

function Format-Json {
    param(
        [Parameter(Mandatory)][string]$Json,
        [int]$Indent = 2
    )
    $indentStr = ' ' * $Indent
    $level = 0
    $inString = $false
    $escaped = $false
    $builder = New-Object System.Text.StringBuilder
    foreach ($char in $Json.ToCharArray()) {
        if ($escaped) { [void]$builder.Append($char); $escaped = $false; continue }
        switch ($char) {
            '"' { $inString = -not $inString; [void]$builder.Append($char) }
            '\\' { [void]$builder.Append($char); if ($inString) { $escaped = $true } }
            '{' { [void]$builder.Append($char); if (-not $inString) { $level++; [void]$builder.Append("`n" + ($indentStr * $level)) } }
            '}' { if (-not $inString) { $level--; [void]$builder.Append("`n" + ($indentStr * $level) + $char) } else { [void]$builder.Append($char) } }
            '[' { [void]$builder.Append($char); if (-not $inString) { $level++; [void]$builder.Append("`n" + ($indentStr * $level)) } }
            ']' { if (-not $inString) { $level--; [void]$builder.Append("`n" + ($indentStr * $level) + $char) } else { [void]$builder.Append($char) } }
            ':' { [void]$builder.Append(': ') }
            ',' { [void]$builder.Append(",`n" + ($indentStr * $level)) }
            default { [void]$builder.Append($char) }
        }
    }
    return $builder.ToString()
}

$formatted = Format-Json -Json $min -Indent 2
Set-Content -Path $path -Value $formatted
"""
